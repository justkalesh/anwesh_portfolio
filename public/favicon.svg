<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Background -->
  <circle cx="60" cy="60" r="60" fill="#0f4c81" />

  <!-- Main 'A' Structure Bonds -->
  <path d="M 30,85 L 60,25 L 90,85 M 45,55 L 75,55" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Chemical details (Double bond on right leg) -->
  <line x1="67" y1="35" x2="87" y2="75" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Branch top -->
  <line x1="60" y1="25" x2="60" y2="12" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <circle cx="60" cy="12" r="4" fill="#ffffff" />

  <!-- Branch left -->
  <line x1="30" y1="85" x2="18" y2="92" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <circle cx="18" cy="92" r="4" fill="#ffffff" />

  <!-- Branch right crossbar -->
  <line x1="75" y1="55" x2="88" y2="55" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <circle cx="88" cy="55" r="4" fill="#ffffff" />

  <!-- Main Nodes -->
  <circle cx="60" cy="25" r="8" fill="#ffffff" />
  <circle cx="30" cy="85" r="8" fill="#ffffff" />
  <circle cx="90" cy="85" r="8" fill="#ffffff" />
  <circle cx="45" cy="55" r="6" fill="#ffffff" />
  <circle cx="75" cy="55" r="6" fill="#ffffff" />
</svg>